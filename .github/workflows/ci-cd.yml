name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Testes e builds
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Testar backend
        run: mvn --batch-mode test
        working-directory: backend

      - name: Testar preparo-service
        run: mvn --batch-mode test
        working-directory: preparo-service

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

  cd:
    name: Publicar imagens Docker
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados backend
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cadu-menezes/pb-tp1-backend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Metadados preparo-service
        id: preparo-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cadu-menezes/pb-tp1-preparo-service
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publicar preparo-service
        uses: docker/build-push-action@v6
        with:
          context: ./preparo-service
          push: true
          tags: ${{ steps.preparo-meta.outputs.tags }}
          labels: ${{ steps.preparo-meta.outputs.labels }}

      - name: Metadados frontend
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cadu-menezes/pb-tp1-frontend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
